# Builds the static site and deploys the `www/` directory to Cloudflare Pages.
# Pull requests build only; pushes to master build and deploy to production.

name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CLOUDFLARE_PAGES_PROJECT: personalwebsite

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 26.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
        cache: npm

    - run: npm ci
    - run: npm run build --if-present

    - name: Deploy to Cloudflare Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy www --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=master
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
