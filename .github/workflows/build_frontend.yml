# Builds the static site and deploys the `www/` directory to Cloudflare Pages.
# Pull requests build only; pushes to master build and deploy to production.

name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CLOUDFLARE_PAGES_PROJECT: personalwebsite

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm

    - run: npm ci
    - run: npm run build --if-present

    - name: Deploy to Cloudflare Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy www --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=master
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
